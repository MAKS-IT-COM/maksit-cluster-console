      <stop offset="0" stop-color="#33A5CF"/>
      <stop offset="1" stop-color="#002A6A"/>
    </linearGradient>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#C5E8F6"/>
